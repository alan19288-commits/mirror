          write_new("src/android/app/src/main/java/org/yuzu/yuzu_emu/utils/AutoTuneHelper.kt", r"""// SPDX-License-Identifier: GPL-3.0-or-later
          // Eden A840 v2.4: helpers for the automatic per-game optimisation.

          package org.yuzu.yuzu_emu.utils

          import android.app.ActivityManager
          import android.app.ApplicationExitInfo
          import android.content.Context
          import android.os.Build
          import java.io.File
          import org.yuzu.yuzu_emu.R
          import org.yuzu.yuzu_emu.features.settings.model.StringSetting

          object AutoTuneHelper {
              /** Times (System.currentTimeMillis) at which this app recently crashed or stopped responding. */
              fun recentCrashTimes(context: Context): LongArray {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
                      return LongArray(0)
                  }
                  return try {
                      val manager = context.getSystemService(ActivityManager::class.java)
                          ?: return LongArray(0)
                      manager.getHistoricalProcessExitReasons(null, 0, 16)
                          .filter {
                              it.reason == ApplicationExitInfo.REASON_CRASH ||
                                  it.reason == ApplicationExitInfo.REASON_CRASH_NATIVE ||
                                  it.reason == ApplicationExitInfo.REASON_ANR
                          }
                          .map { it.timestamp }
                          .toLongArray()
                  } catch (e: Exception) {
                      LongArray(0)
                  }
              }

              /** Identifies the GPU driver in use so learned levels reset when it changes. */
              fun driverTag(): String = try {
                  val path = StringSetting.DRIVER_PATH.getString()
                  if (path.isEmpty()) "system" else File(path).name
              } catch (e: Exception) {
                  "unknown"
              }

              fun describe(context: Context, code: Int): String {
                  val level = code and 0xF
                  val event = (code shr 4) and 0xF
                  val levelName = context.getString(
                      when (level) {
                          0 -> R.string.auto_tune_level_performance
                          1 -> R.string.auto_tune_level_balanced
                          else -> R.string.auto_tune_level_stable
                      }
                  )
                  val text = context.getString(R.string.auto_tune_toast, levelName)
                  val note = when (event) {
                      1 -> R.string.auto_tune_event_crash
                      2 -> R.string.auto_tune_event_probe
                      3 -> R.string.auto_tune_event_reset
                      else -> 0
                  }
                  return if (note != 0) "$text · ${context.getString(note)}" else text
              }
          }
          """,
