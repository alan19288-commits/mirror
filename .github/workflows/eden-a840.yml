          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publicar APK en la rama builds (para copiarlo a Drive)
        run: |
          set -e
          APK=$(find src/android/app/build/outputs/apk -name '*.apk' | head -1)
          rm -rf /tmp/builds && mkdir -p /tmp/builds
          cp "$APK" /tmp/builds/Eden-A840-v2.3.apk
          cd /tmp/builds
          sha256sum Eden-A840-v2.3.apk > Eden-A840-v2.3.apk.sha256
          cat Eden-A840-v2.3.apk.sha256
          git init -q -b builds
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Eden A840 v2.3 APK (${GITHUB_SHA::7})"
