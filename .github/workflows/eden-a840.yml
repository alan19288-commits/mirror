      - name: Compilar APK (tarda 1-2 horas)
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleGenshinSpoofRelease --no-daemon --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Eden-A840-v2.4-apk
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publicar APK en la rama builds (para copiarlo a Drive)
        run: |
          set -e
          APK=$(find src/android/app/build/outputs/apk -name '*.apk' | head -1)
          rm -rf /tmp/builds && mkdir -p /tmp/builds
          cp "$APK" /tmp/builds/Eden-A840-v2.4.apk
          cd /tmp/builds
          sha256sum Eden-A840-v2.4.apk > Eden-A840-v2.4.apk.sha256
          cat Eden-A840-v2.4.apk.sha256
          git init -q -b builds
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Eden A840 v2.4 APK (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
