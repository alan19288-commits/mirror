          #!/usr/bin/env python3
          # Eden A840 v2.4 source patches (applied after v2.3). Run from the Eden source root.
          # Every edit is anchored on exact text and must match exactly once.
          import os
          import sys


          def edit(path, old, new, label):
              with open(path, encoding="utf-8") as f:
                  src = f.read()
              if new in src:
                  print(f"[skip] {label}: already applied")
                  return
              n = src.count(old)
              if n != 1:
                  sys.exit(f"[FAIL] {label}: anchor found {n} times in {path}")
              src = src.replace(old, new)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(src)
              print(f"[ok]   {label}")


          def write_new(path, content, label):
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as f:
                      if f.read() == content:
                          print(f"[skip] {label}: already present")
                          return
                  sys.exit(f"[FAIL] {label}: {path} already exists with other content")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"[ok]   {label}")


          # ---------------------------------------------------------------------------
          # 1. Setting: eden_auto_tune (per game, off by default).
          # ---------------------------------------------------------------------------
          edit("src/common/settings.h",
          """    SwitchableSetting<bool> unlock_guest_fps{linkage, false, "unlock_guest_fps",
                                                       Category::RendererAdvanced};""",
          """    SwitchableSetting<bool> unlock_guest_fps{linkage, false, "unlock_guest_fps",
                                                       Category::RendererAdvanced};

              // Eden A840 v2.4: automatic per-game optimisation for Snapdragon 8 Elite Gen 5 (Android).
              SwitchableSetting<bool> eden_auto_tune{linkage, false, "eden_auto_tune",
                                                     Category::RendererAdvanced};""",
          "Settings: eden_auto_tune")

          # ---------------------------------------------------------------------------
          # 2. Native auto-tune engine (header only, used by native.cpp and native_config.cpp).
          # ---------------------------------------------------------------------------
          write_new("src/android/app/src/main/jni/eden_auto_tune.h", r"""// SPDX-License-Identifier: GPL-3.0-or-later
          // Eden A840 v2.4: automatic per-game optimisation for Snapdragon 8 Elite Gen 5 / Adreno 840.
          //
          // When "eden_auto_tune" is on, every boot gets a profile chosen for this SoC. The profile only
          // touches settings the user did not customise for that game, lives on the per-game ("custom")
          // layer of each setting so the global configuration is never rewritten, and is undone when the
          // game stops. A crash during a session moves that game to a safer level; after several clean
          // sessions the faster level is tried once more.

          #pragma once

          #include <algorithm>
          #include <cctype>
          #include <chrono>
          #include <cstdint>
          #include <cstdlib>
          #include <filesystem>
          #include <fstream>
          #include <functional>
          #include <map>
          #include <memory>
          #include <mutex>
          #include <sstream>
          #include <string>
          #include <thread>
          #include <utility>
          #include <vector>

          #include "android_settings.h"
          #include "common/fs/path_util.h"
          #include "common/logging.h"
          #include "common/scm_rev.h"
          #include "common/settings.h"

          namespace EdenAutoTune {

          enum Level : int {
              Performance = 0,
              Balanced = 1,
              Stable = 2,
          };

          enum Event : int {
              NoEvent = 0,
              Escalated = 1,
              Probing = 2,
              Reset = 3,
          };

          constexpr int kMaxLevel = Stable;
          constexpr std::int64_t kCleanSessionsBeforeProbe = 4;
          constexpr std::int64_t kMinCleanSessionMs = 120'000;

          using KeyValues = std::map<std::string, std::string>;

          struct Override {
              std::function<bool()> holds;
              std::function<void()> undo;
              std::function<bool()> redo;
          };

          struct State {
              std::mutex mutex;
              std::string pending_title;
              int pending_level = -1;
              std::vector<Override> overrides;
              bool applied = false;
              bool suspended = false;
              std::string session_title;
              std::int64_t session_started = 0;
          };

          inline State& Get() {
              static State state;
              return state;
          }

          inline std::int64_t NowMs() {
              return std::chrono::duration_cast<std::chrono::milliseconds>(
                         std::chrono::system_clock::now().time_since_epoch())
                  .count();
          }

          inline std::filesystem::path Dir() {
              return Common::FS::GetEdenPath(Common::FS::EdenPath::ConfigDir) / "auto_tune";
          }

          inline std::filesystem::path TitlePath(const std::string& title) {
              return Dir() / (title + ".ini");
          }

          inline std::filesystem::path SessionPath() {
              return Dir() / "session.ini";
          }

          inline KeyValues ReadKv(const std::filesystem::path& path) {
              KeyValues kv;
              std::ifstream in(path);
              std::string line;
              while (std::getline(in, line)) {
                  const auto eq = line.find('=');
                  if (eq != std::string::npos) {
                      kv[line.substr(0, eq)] = line.substr(eq + 1);
                  }
              }
              return kv;
          }

          inline void WriteKv(const std::filesystem::path& path, const KeyValues& kv) {
              std::error_code ec;
              std::filesystem::create_directories(path.parent_path(), ec);
              const std::string tmp = path.string() + ".tmp";
              {
                  std::ofstream out(tmp, std::ios::trunc);
                  for (const auto& [key, value] : kv) {
                      out << key << '=' << value << '\n';
                  }
                  if (!out) {
                      return;
                  }
              }
              std::filesystem::rename(tmp, path, ec);
          }

          inline std::int64_t ToInt(const KeyValues& kv, const char* key, std::int64_t fallback = 0) {
              const auto it = kv.find(key);
              if (it == kv.end()) {
                  return fallback;
              }
              try {
                  return std::stoll(it->second);
              } catch (...) {
                  return fallback;
              }
          }

          inline std::string SanitizeTitle(const std::string& title) {
              std::string out;
              for (const char c : title) {
                  if (std::isalnum(static_cast<unsigned char>(c))) {
                      out += c;
                  }
              }
              return out.empty() ? std::string{"0"} : out;
          }

          inline std::string BuildId() {
              return std::string{"A840-v2.4 "} + Common::g_build_fullname + " " + Common::g_build_date;
          }

          inline const char* LevelName(int level) {
              switch (level) {
              case Performance:
                  return "performance";
              case Balanced:
                  return "balanced";
              default:
                  return "stable";
              }
          }

          // Puts `value` on the custom layer of a setting the user left on the global value.
          template <typename T, bool R>
          inline void Tune(State& state, Settings::SwitchableSetting<T, R>& setting, T value) {
              auto* const p = &setting;
              auto saved = std::make_shared<T>();
              auto apply = [p, value, saved]() -> bool {
                  if (!p->UsingGlobal()) {
                      return false;
                  }
                  p->SetGlobal(false);
                  *saved = p->GetValue();
                  p->SetValue(value);
                  return true;
              };
              if (!apply()) {
                  return;
              }
              const T tuned = p->GetValue();
              state.overrides.push_back(Override{
                  [p, tuned] { return !p->UsingGlobal() && p->GetValue() == tuned; },
                  [p, saved] {
                      p->SetValue(*saved);
                      p->SetGlobal(true);
                  },
                  std::move(apply),
              });
          }

          inline void ApplyProfileLocked(State& state, int level) {
              auto& v = Settings::values;
          #ifdef HAS_NCE
              Tune(state, v.cpu_backend,
                   level >= Stable ? Settings::CpuBackend::Dynarmic : Settings::CpuBackend::Nce);
          #endif
              Tune(state, v.cpu_accuracy, Settings::CpuAccuracy::Auto);
              Tune(state, v.use_multi_core, true);
              Tune(state, v.gpu_accuracy,
                   level >= Balanced ? Settings::GpuAccuracy::High : Settings::GpuAccuracy::Low);
              Tune(state, v.dma_accuracy,
                   level >= Balanced ? Settings::DmaAccuracy::Safe : Settings::DmaAccuracy::Default);
              Tune(state, v.use_asynchronous_gpu_emulation, true);
              Tune(state, v.use_asynchronous_shaders, true);
              Tune(state, v.use_reactive_flushing, level >= Stable);
              Tune(state, v.use_disk_shader_cache, true);
              Tune(state, v.use_vulkan_driver_pipeline_cache, true);
              if (std::thread::hardware_concurrency() >= 8) {
                  Tune(state, AndroidSettings::values.pipeline_worker_count, 4);
              }
          }

          inline void RestoreLocked(State& state) {
              if (!state.suspended) {
                  for (auto it = state.overrides.rbegin(); it != state.overrides.rend(); ++it) {
                      if (it->holds()) {
                          it->undo();
                      }
                  }
              }
              state.overrides.clear();
              state.applied = false;
              state.suspended = false;
          }

          inline void MergeTuDebugFlag(const std::string& flag) {
              std::string value;
              if (const char* current = std::getenv("TU_DEBUG")) {
                  value = current;
              }
              std::stringstream tokens(value);
              std::string token;
              while (std::getline(tokens, token, ',')) {
                  if (token == flag) {
                      return;
                  }
              }
              if (!value.empty()) {
                  value += ',';
              }
              value += flag;
              setenv("TU_DEBUG", value.c_str(), 1);
          }

          // Turnip reads TU_DEBUG once per process, so this runs before the driver is first used.
          // "maxgpu" (Turnip A840 v2.3+) keeps the GPU at its top power level while it renders.
          inline void PrepareDriverEnv() {
              if (Settings::values.eden_auto_tune.GetValue()) {
                  MergeTuDebugFlag("maxgpu");
              }
          }

          // Called before boot. Returns -1 when disabled, otherwise level | (event << 4).
          inline int Prepare(const std::string& raw_title, const std::vector<std::int64_t>& crash_times,
                             const std::string& driver) {
              auto& state = Get();
              std::scoped_lock lock{state.mutex};
              state.pending_title.clear();
              state.pending_level = -1;
              if (!Settings::values.eden_auto_tune.GetValue()) {
                  return -1;
              }

              const std::string title = SanitizeTitle(raw_title);
              const std::int64_t now = NowMs();
              int event = NoEvent;

              // Attribute an Android-reported crash to the session that was open, whichever game it was.
              KeyValues session = ReadKv(SessionPath());
              if (ToInt(session, "open") == 1) {
                  const std::int64_t started = ToInt(session, "started");
                  const bool crashed = std::any_of(crash_times.begin(), crash_times.end(),
                                                   [&](std::int64_t t) { return t >= started && t <= now; });
                  const std::string previous = session["title"];
                  if (crashed && !previous.empty()) {
                      KeyValues st = ReadKv(TitlePath(previous));
                      const std::int64_t level = std::clamp<std::int64_t>(ToInt(st, "level"), 0, kMaxLevel);
                      if (ToInt(st, "probed") == 1) {
                          st["locked"] = "1";
                      }
                      const std::int64_t next = std::min<std::int64_t>(level + 1, kMaxLevel);
                      st["level"] = std::to_string(next);
                      st["probe"] = "0";
                      st["clean"] = "0";
                      st["crashes"] = std::to_string(ToInt(st, "crashes") + 1);
                      WriteKv(TitlePath(previous), st);
                      LOG_WARNING(Frontend, "[AutoTune] {} crashed in its last session, level {} -> {}",
                                  previous, level, next);
                      if (previous == title && next != level) {
                          event = Escalated;
                      }
                  }
                  session["open"] = "0";
                  WriteKv(SessionPath(), session);
              }

              KeyValues st = ReadKv(TitlePath(title));
              const std::string build = BuildId();
              if (!st.empty() && (st["build"] != build || st["driver"] != driver)) {
                  if (ToInt(st, "level") > 0) {
                      event = Reset;
                  }
                  st.clear();
              }
              st["build"] = build;
              st["driver"] = driver;

              int level = static_cast<int>(std::clamp<std::int64_t>(ToInt(st, "level"), 0, kMaxLevel));
              if (event == NoEvent && level > 0 && ToInt(st, "locked") == 0 &&
                  ToInt(st, "clean") >= kCleanSessionsBeforeProbe) {
                  level -= 1;
                  st["probe"] = "1";
                  st["probed"] = "1";
                  st["clean"] = "0";
                  event = Probing;
              }
              st["level"] = std::to_string(level);
              WriteKv(TitlePath(title), st);

              state.pending_title = title;
              state.pending_level = level;
              LOG_INFO(Frontend, "[AutoTune] {} -> {} profile (event {}, driver '{}')", title,
                       LevelName(level), event, driver);
              return level | (event << 4);
          }

          // Called on the emulation thread right before the system applies settings and boots.
          inline void ApplyPending() {
              auto& state = Get();
              std::scoped_lock lock{state.mutex};
              RestoreLocked(state);
              if (state.pending_level < 0 || state.pending_title.empty() ||
                  !Settings::values.eden_auto_tune.GetValue()) {
                  return;
              }
              ApplyProfileLocked(state, state.pending_level);
              state.applied = true;
              MergeTuDebugFlag("maxgpu");

              state.session_title = state.pending_title;
              state.session_started = NowMs();
              WriteKv(SessionPath(), KeyValues{
                                         {"title", state.session_title},
                                         {"started", std::to_string(state.session_started)},
                                         {"open", "1"},
                                     });
              LOG_INFO(Frontend, "[AutoTune] applied {} profile to {} ({} settings)",
                       LevelName(state.pending_level), state.session_title, state.overrides.size());
          }

          // Called when emulation stops normally.
          inline void OnShutdown() {
              auto& state = Get();
              std::scoped_lock lock{state.mutex};
              RestoreLocked(state);
              if (state.session_started == 0) {
                  return;
              }
              const std::int64_t duration = NowMs() - state.session_started;
              WriteKv(SessionPath(), KeyValues{
                                         {"title", state.session_title},
                                         {"started", std::to_string(state.session_started)},
                                         {"open", "0"},
                                     });
              if (duration >= kMinCleanSessionMs) {
                  KeyValues st = ReadKv(TitlePath(state.session_title));
                  if (!st.empty()) {
                      st["clean"] = std::to_string(ToInt(st, "clean") + 1);
                      st["probe"] = "0";
                      WriteKv(TitlePath(state.session_title), st);
                  }
              }
              state.session_started = 0;
          }

          // Gives the user's own values back while settings are being edited or saved.
          inline bool Suspend() {
              auto& state = Get();
              std::scoped_lock lock{state.mutex};
              if (!state.applied || state.suspended) {
                  return false;
              }
              std::vector<Override> kept;
              for (auto& o : state.overrides) {
                  if (o.holds()) {
                      o.undo();
                      kept.push_back(std::move(o));
                  }
              }
              state.overrides = std::move(kept);
              state.suspended = true;
              return true;
          }

          inline void Resume() {
              auto& state = Get();
              std::scoped_lock lock{state.mutex};
              if (!state.applied || !state.suspended) {
                  return;
              }
              state.suspended = false;
              if (!Settings::values.eden_auto_tune.GetValue()) {
                  state.overrides.clear();
                  state.applied = false;
                  return;
              }
              std::vector<Override> kept;
              for (auto& o : state.overrides) {
                  if (o.redo()) {
                      kept.push_back(std::move(o));
                  }
              }
              state.overrides = std::move(kept);
          }

          } // namespace EdenAutoTune
          """,
          "AutoTune: engine header")

