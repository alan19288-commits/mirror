          edit("src/android/app/src/main/java/org/yuzu/yuzu_emu/activities/EmulationActivity.kt",
          """        // Eden A840 v2.3: keep the game window at the panel's highest refresh rate.
                  runCatching {
                      display?.supportedModes?.maxByOrNull { it.refreshRate }?.let { mode ->
                          val params = window.attributes
                          params.preferredDisplayModeId = mode.modeId
                          window.attributes = params
                      }
                  }
          """,
          """        // Eden A840 v2.4: panel mode for the game window. With the A840 auto-optimisation on,
                  // prefer an exact multiple of 60 Hz (120 Hz) so 30/60 fps games get even frame pacing;
                  // otherwise keep the v2.3 behaviour (highest refresh rate).
                  runCatching {
                      val modes = display?.supportedModes ?: emptyArray<android.view.Display.Mode>()
                      val current = display?.mode
                      val sameSize = modes.filter {
                          current == null || (it.physicalWidth == current.physicalWidth &&
                              it.physicalHeight == current.physicalHeight)
                      }.ifEmpty { modes.toList() }
                      val evenPacing = sameSize.filter {
                          val ratio = it.refreshRate / 60f
                          it.refreshRate >= 59f && kotlin.math.abs(ratio - ratio.roundToInt()) < 0.02f
                      }.maxByOrNull { it.refreshRate }
                      val fastest = sameSize.maxByOrNull { it.refreshRate }
                      val autoTune = BooleanSetting.EDEN_AUTO_TUNE.getBoolean(true)
                      (if (autoTune) evenPacing ?: fastest else fastest)?.let { mode ->
                          val params = window.attributes
                          params.preferredDisplayModeId = mode.modeId
                          window.attributes = params
                      }
                  }
                  window.decorView.post { requestLowLatencyInput() }
          """,
          "Display/input: 120 Hz pacing and low-latency input")

